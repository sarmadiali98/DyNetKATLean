name = "DyNetKAT"
version = "0.1.0"

[[lean_lib]]
name = "DyNetKAT"
globs = ["DyNetKAT", "DyNetKAT.Frontend.+"]

[[lean_exe]]
name = "dynetkat"
root = "DyNetKAT.Main"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.19.0"

[[lean_lib]]
name = "KATLean"
globs = ["KATLean", "KATLean.Native", "KATLean.Native.+"]

[[lean_lib]]
name = "NetKATLean"

[[lean_lib]]
name = "DyNetKATLean"

name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [katlean, netkatlean, dynetkatlean, integration]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build locked image
        run: docker build -f docker/Dockerfile --target "${{ matrix.target }}" -t "verify:${{ matrix.target }}" .
      - name: Run verification without network
        run: docker run --rm --network none "verify:${{ matrix.target }}"
